name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不使用 actions/setup-node：该步骤依赖下载 Node 二进制，
      # GitHub Actions 基础设施故障时会在 Setup Node 一步失败（2026-08-03 实测）。
      # ubuntu-latest runner 自带 Node.js/npm，直接使用即可，少一个故障点。
      - name: Install dependencies
        run: npm install

      # 补全主题目录：themes/landscape 只包含自定义模板（categories.ejs、home.ejs、nav.ejs 等），
      # 其余模板/样式/脚本从 npm 主题包复制。用 -n 不覆盖已有文件，保护自定义模板。
      # 缺少此步会导致主题目录不完整，Hexo 渲染出无模板的空页面（白屏）。不要删除此步骤。
      - name: Complete theme directory
        run: cp -rn node_modules/hexo-theme-landscape/. themes/landscape/

      - name: Generate static files
        run: npx hexo generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
